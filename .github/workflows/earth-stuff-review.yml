name: Review Earth Stuff integration
on:
  push:
    branches: ['feature/earth-stuff-fairness-2026-09-07']
permissions:
  contents: read
concurrency:
  group: earth-stuff-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Full existing repository tests and build
        run: npm test
      - name: Install isolated browser review tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Browser review of hub entry and new family companion
        run: python tmp/earth-source/scripts/review-earth-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: earth-stuff-review-${{ github.sha }}
          path: |
            earth-review/
            pages-dist/earth-stuff-fairness/
          retention-days: 14
